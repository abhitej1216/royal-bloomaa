<header class="header">
        <nav class="navbar navbar-expand-lg">
          <div class="container">
            <a class="navbar-brand" routerLink="/">
              <img src="assets/images/logo/logo.svg" alt="Royal Bloomaa Logo">
            </a>
            <button 
              class="navbar-toggler" 
              type="button" 
              (click)="toggleMenu()"
              [attr.aria-expanded]="isMenuOpen"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div 
              class="collapse navbar-collapse" 
              [class.show]="isMenuOpen"
            >
              <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                  <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
                </li>
                <li class="nav-item dropdown">
                  <a class="nav-link dropdown-toggle" href="javascript:void(0)">
                    Collection
                  </a>
                  <div class="dropdown-menu-wrapper">
                    <div class="dropdown-menu">
                      <a class="dropdown-item" routerLink="/shop">All Products</a>
                      <a class="dropdown-item" routerLink="/shop">New Arrivals</a>
                      <a class="dropdown-item" routerLink="/shop">Best Sellers</a>
                    </div>
                  </div>
                </li>
                <li class="nav-item dropdown">
                  <a class="nav-link dropdown-toggle" href="javascript:void(0)">
                    Shop
                  </a>
                  <div class="dropdown-menu-wrapper">
                    <div class="dropdown-menu">
                      <a class="dropdown-item" routerLink="/shop">Perfumes</a>
                      <a class="dropdown-item" routerLink="/shop">Attars</a>
                      <a class="dropdown-item" routerLink="/shop">Body Mists</a>
                      <a class="dropdown-item" routerLink="/shop">Gift Sets</a>
                    </div>
                  </div>
                </li>
               
                <li class="nav-item">
                  <a class="nav-link" routerLink="/blog" routerLinkActive="active">Blog</a>
                </li>
                <li class="nav-item dropdown">
                  <a class="nav-link dropdown-toggle" (click)="toggleDropdown('about')">
                    About & Help
                  </a>
                  <div class="dropdown-menu-wrapper" >
                    <div class="dropdown-menu">
                    <a class="dropdown-item" routerLink="/about">About Us</a>
                    <a class="dropdown-item" routerLink="/contact">Contact</a>
                    <a class="dropdown-item" routerLink="/privacy-policy">Privacy Policy</a>
                    <a class="dropdown-item" routerLink="/terms">Terms & Conditions</a>
                    <a class="dropdown-item" routerLink="/refund">Refund Policy</a>
                  </div>
                  </div>
                </li>
              </ul>
              <div class="header-actions">
                <button class="icon-btn" (click)="toggleSearch()">
                  <i class="fas fa-search"></i>
                </button>
                <div class="dropdown">
                  <button class="icon-btn" (click)="toggleDropdown('auth')">
                    <i class="fas fa-user"></i>
                  </button>
                  <ul class="dropdown-menu" [class.show]="activeDropdown === 'auth'">
                    <li>
                      <a class="dropdown-item" [routerLink]="['/login']" (click)="closeDropdown()">
                        <i class="fas fa-sign-in-alt"></i> Login
                      </a>
                    </li>
                    <li>
                      <a class="dropdown-item" [routerLink]="['/signup']" (click)="closeDropdown()">
                        <i class="fas fa-user-plus"></i> Register
                      </a>
                    </li>
                  </ul>
                </div>
                <a routerLink="/cart" class="icon-btn cart-icon">
                  <i class="fas fa-shopping-cart"></i>
                  <span class="cart-count" *ngIf="cartCount > 0">{{cartCount}}</span>
                </a>
              </div>
            </div>
          </div>
        </nav>

        <!-- Search Overlay -->
        <div class="search-overlay" *ngIf="isSearchOpen">
          <div class="container">
            <form class="search-form" (submit)="onSearch($event)">
              <input 
                type="text" 
                [(ngModel)]="searchQuery" 
                name="query"
                placeholder="Search products..." 
                class="search-input"
                autofocus
              >
              <button type="submit" class="search-submit">
                <i class="fas fa-search"></i>
              </button>
              <button type="button" class="close-search" (click)="toggleSearch()">
                <i class="fas fa-times"></i>
              </button>
            </form>
          </div>
        </div>
      </header>
